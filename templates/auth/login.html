<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Sugar Plant Predictive Maintenance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1329 0%, #1e293b 100%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-lg);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">&#x2699;</div>
      <h1 style="font-size: 1.35rem; color: var(--navy-dark); font-weight: 700;">Sugar Plant Maintenance</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem;">
        Condition Monitoring &amp; Failure Risk Intelligence
      </p>
    </div>

    <!-- Flash Messages -->
    {% if error %}
      <div class="alert-banner alert-danger">
        <span>{{ error }}</span>
      </div>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert-banner alert-{{ category }}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin" value="{{ username or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem; margin-top: 0.5rem; font-weight: 600;">
        Sign In to Control Room
      </button>
    </form>

  </div>
</body>
</html>
